# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://docs.hugoblox.com/reference/language/

# Default language
en:
  LanguageCode: en-us
  languageName: English
  weight: 1

# Traditional Chinese (Taiwan). Only the homepage is translated; the menu
# links to the English pages for everything else (skip_lang_prefix keeps
# those links from getting a /zh-hant/ prefix; see the navbar override).
zh-hant:
  languageCode: zh-TW
  languageName: 繁體中文
  weight: 2
  title: 陳成文 Salman Farisi
  params:
    marketing:
      seo:
        description: '陳成文（Salman Al Farisi），國立清華大學天文研究所研究助理，即將於英國愛丁堡大學攻讀博士，研究銀河考古學與銀河系恆星暈。'
  menus:
    main:
      - name: 首頁
        url: /
        weight: 10
      - name: 關於我 (EN)
        url: /about/
        weight: 15
        params:
          skip_lang_prefix: true
      - name: 研究 (EN)
        url: /research/
        weight: 17
        params:
          skip_lang_prefix: true
      - name: 經歷 (EN)
        url: /experience/
        weight: 20
        params:
          skip_lang_prefix: true
      - name: 專案 (EN)
        url: /projects/
        weight: 30
        params:
          skip_lang_prefix: true
      - name: 禪意花園 (EN)
        url: /zen-garden/
        weight: 35
        params:
          skip_lang_prefix: true
      - name: Flat Curvature
        url: https://flatcurvature.github.io/
        weight: 40

